name: Story
description: A self-contained capability within an approved epic.
title: "[Story] S-X.Y: "
labels:
  - "type:story"
  - "status:backlog"
body:
  - type: input
    id: parent_epic
    attributes:
      label: Parent epic
      placeholder: "#12"
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Who implements this. Exactly one owner.
      placeholder: "worker-1"
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Depends on / Blocks
      description: Issue numbers. State which dependencies have already landed.
      placeholder: "Depends on #14 (landed), blocks #17"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and baseline
      description: >
        The capability this delivers, and the relevant behaviour on the target
        branch today. Assume the implementer knows only this issue and
        the repository — no earlier conversation, no private
        plan, no "as discussed".
    validations:
      required: true
  - type: textarea
    id: shared_resources
    attributes:
      label: Shared resources
      description: Modules, schemas, migrations, services and runtime resources touched.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Name the neighbouring systems explicitly not redesigned here.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        Observable outcomes, one per line. Separate deterministic claims from
        those needing a live run.
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: End-to-end contract trace
      description: >
        Trace producer to transport to persistence to recovery to consumer.
        Name the versioned contract at every boundary and the observable effect.
    validations:
      required: true
  - type: textarea
    id: failure_privacy
    attributes:
      label: Failure, race, recovery and privacy cases
      description: >
        Negative inputs, duplicate or concurrent execution, interruption and
        restart behaviour, rollback, and data that must never enter evidence.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: >
        Commands and the evidence each produces. Cheap focused checks while
        iterating, the full required gate once at candidate freeze. Name the
        surfaces that are explicitly not required.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority, effect lane and stop conditions
      description: >
        Claim owner, semantic ownership boundary, exclusive shared effect lane
        if any, branch/landing target, and the exact condition that parks or
        stops implementation.
    validations:
      required: true
  - type: dropdown
    id: plan_review
    attributes:
      label: Plan review status
      options:
        - Pending review
        - Approved
    validations:
      required: true
