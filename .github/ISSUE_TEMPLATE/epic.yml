name: Epic
description: An exclusively owned initiative spanning multiple bounded stories.
title: "[Epic] E-X: "
labels:
  - "type:epic"
  - "status:backlog"
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and baseline
      description: >
        What observable outcome does this epic deliver, and what is the current
        behaviour on the target branch? Assume the reader knows only this issue.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Who implements this. Exactly one owner, and nobody else works it.
      placeholder: "worker-1"
    validations:
      required: true
  - type: textarea
    id: shared_resources
    attributes:
      label: Shared resources
      description: >
        Every module, schema, migration, service and runtime resource this epic
        touches. This is how a colliding epic is spotted before code is written.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Name the neighbouring systems that are explicitly not redesigned here.
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: Stories and dependency graph
      description: |
        List the child stories with their disposition, then the dependency order.

        ```text
        S-X.1 -> S-X.2
        ```
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Acceptance gates
      description: Objective, observable completion criteria. One line each.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: >
        Commands to run, readbacks to perform, evidence artifacts to produce.
        Live and device evidence belongs to the story that owns the claim.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Dependencies and risks
      description: Owner gates, external waits, rollback constraints.
    validations:
      required: true
  - type: dropdown
    id: plan_review
    attributes:
      label: Plan review status
      description: No implementation starts while this is pending.
      options:
        - Pending review
        - Approved
    validations:
      required: true
