name: External issue guard

# Repository settings restrict issue creation to collaborators. This guard is
# the fail-closed second layer if that setting drifts or an older/existing issue
# is reopened. It never checks out code or evaluates issue content.
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: external-issue-guard-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guard:
    name: external-issue-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const allowedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const allowedBots = new Set(['github-actions[bot]', 'dependabot[bot]']);
            if (
              allowedAssociations.has(issue.author_association) ||
              allowedBots.has(issue.user.login)
            ) {
              core.info(
                `internal issue by ${issue.user.login} (${issue.author_association}) - allowed`
              );
              return;
            }

            const feedback = 'https://github.com/silentspike/blenderbot-feedback/issues/new/choose';
            const msg =
              `Hi @${issue.user.login}, thank you for the report.\n\n` +
              'This tracker is reserved for approved blenderbot implementation work, ' +
              'so external reports are kept in a separate feedback pool. This issue ' +
              'was closed automatically and was not added to the implementation ' +
              `backlog. Please reopen the idea or bug in the ` +
              `[blenderbot feedback tracker](${feedback}).\n\n` +
              'For a security vulnerability, use the private security advisory form ' +
              'instead of either public tracker.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: msg,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });
